# The version catalog (roadmap 3.3) organises versions; this is what actually stops them
# drifting. kanso's toolchain is already ~20 months behind, which is how it got there.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      # Not a version of its own: it is the Android runtime that `sdk=34` selects for the
      # Robolectric release in use (`robolectric-android-all` in gradle/libs.versions.toml). It
      # moves with those, by hand, together with its checksums in
      # gradle/verification-metadata.xml.
      - dependency-name: "org.robolectric:android-all-instrumented"
    groups:
      # Compose ships as one aligned set behind the BOM — bumping it in pieces is noise.
      compose:
        patterns:
          - "androidx.compose*"
      androidx:
        patterns:
          - "androidx.*"
        exclude-patterns:
          - "androidx.compose*"
      dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "androidx.*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
