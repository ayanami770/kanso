# The version catalog (roadmap 3.3) organises versions; this is what actually stops them
# drifting. kanso's toolchain is already ~20 months behind, which is how it got there.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      # Compose ships as one aligned set behind the BOM — bumping it in pieces is noise.
      compose:
        patterns:
          - "androidx.compose*"
      androidx:
        patterns:
          - "androidx.*"
        exclude-patterns:
          - "androidx.compose*"
      dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "androidx.*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
