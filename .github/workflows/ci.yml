# kanso CI — proves the library compiles and that the colour engine still meets its contract.
#
# Deliberately minimal: build + unit tests, nothing else. Gates for tasks that do not exist
# yet (apiCheck, screenshot verification) would only make this workflow red from day one, and
# a workflow nobody trusts is worse than no workflow. Add each gate with the task it checks.
#
# kanso is consumed as a git submodule, so a broken `main` breaks every app that depends on it
# at their next `git submodule update` — this job is what stops that.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Run the tests before the build: the colour contract is the thing most worth failing
      # fast on, and a red suite here is more informative than a downstream build error.
      - name: Unit tests
        run: ./gradlew :kanso:testDebugUnitTest

      - name: Build library and demo
        run: ./gradlew :kanso:assembleRelease :demo:assembleDebug

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: kanso/build/reports/tests/
          if-no-files-found: ignore
