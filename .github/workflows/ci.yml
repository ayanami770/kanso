# kanso CI — proves the library compiles and that the colour engine still meets its contract.
#
# Each gate lands with the task it checks — a workflow that is red from day one is one nobody
# trusts. Build and unit tests came first; lint joined once the toolchain upgrade fixed the
# crash that had forced it off.
#
# kanso is consumed as a git submodule, so a broken `main` breaks every app that depends on it
# at their next `git submodule update` — this job is what stops that.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6

      # First, because it is the cheapest gate and the only one whose fix is a single command.
      # A formatting failure buried under a four-minute build is a worse experience than one
      # that arrives in twenty seconds.
      - name: Format
        run: ./gradlew spotlessCheck

      # Run the tests before the build: the colour contract is the thing most worth failing
      # fast on, and a red suite here is more informative than a downstream build error.
      - name: Unit tests
        run: ./gradlew :kanso:testDebugUnitTest

      # verifyRoborazziDebug runs the screenshot goldens; it supersedes testDebugUnitTest,
      # which it invokes. Kept as one step so a pixel diff and a failed assertion surface
      # together rather than one masking the other.
      - name: Screenshot goldens
        run: ./gradlew :kanso:verifyRoborazziDebug

      # :demo:assembleRelease is minified, so this is what actually runs R8 over kanso's
      # output and executes consumer-rules.pro's claim that it needs no keep rules.
      - name: Build library and demo
        run: ./gradlew :kanso:assembleRelease :demo:assembleDebug :demo:assembleRelease

      # Lint is a consumer-facing gate for a library in a way it is not for an app: it catches
      # an unguarded API-level call against the advertised minSdk, and a consumer cannot lint
      # kanso's compiled code themselves. It was disabled for a toolchain crash, not a policy.
      - name: Lint
        run: ./gradlew :kanso:lintRelease

      # Builds the docs without publishing them, so a KDoc link that no longer resolves fails
      # here rather than on main. checkDokkaLinks also reads the generated HTML back for links
      # that resolve but have no page — Dokka does not warn about those.
      - name: API docs
        run: ./gradlew :kanso:checkDokkaLinks

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: test-report
          path: kanso/build/reports/tests/
          if-no-files-found: ignore

      # The actual/expected/diff triptych for any golden that moved — without it a pixel
      # failure is unactionable from the log alone.
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: screenshot-diffs
          path: kanso/build/outputs/roborazzi/
          if-no-files-found: ignore
