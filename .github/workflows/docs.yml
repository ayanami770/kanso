# Publishes kanso's API documentation to GitHub Pages.
#
# Separate from ci.yml on purpose. This job writes somewhere — it deploys — while CI only reads
# and reports, and the two want different permissions: `pages: write` and `id-token: write`
# belong to exactly one workflow, not to the job that runs on every pull request.
#
# Docs are *generated* in CI on every PR (see the "API docs" step there), so a broken KDoc link
# fails before merge. This workflow only publishes what main already proved buildable.
name: Docs

on:
  push:
    branches: [main]
  # For re-publishing without a code change — a Pages settings fix, say.
  workflow_dispatch:

concurrency:
  # Not cancel-in-progress: a half-finished deploy would leave the site serving a partial
  # upload. Queue instead, and let the newest push win once the current one lands.
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    name: Publish API docs
    # main-only publish guard. workflow_dispatch lets a user pick any ref, and this job holds
    # pages: write + id-token: write, so without this an unreviewed branch could be dispatched and
    # published to the official Pages site — past the main-only trust boundary. A push already only
    # fires on main; this makes a manual run obey the same rule. (Belt-and-braces to a github-pages
    # environment deployment-branch restriction, which lives in repo settings, not this file.)
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb  # v6

      # checkDokkaLinks depends on the generate task, so this both builds the site and fails on
      # any link that would render as plain text.
      - name: Generate API docs
        run: ./gradlew :kanso:checkDokkaLinks

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: kanso/build/dokka/html

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
